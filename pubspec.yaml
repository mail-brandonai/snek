name: slither
description: A hyper-casual snake arena prototype for Web and Android.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.38.0
  shared_preferences: ^2.5.5
  crypto: ^3.0.6
  drift: 2.35.0
  drift_flutter: ^0.3.1
  isolate_manager: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.16.1
  drift_dev: 2.35.0
  isolate_manager_generator: ^0.4.2

flutter:
  uses-material-design: true
