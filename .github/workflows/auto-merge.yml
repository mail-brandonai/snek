name: Auto-merge passing PRs

on:
  workflow_run:
    workflows: ["Flutter checks"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted
    steps:
      - name: Merge the exact validated pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          # workflow_run.pull_requests is not guaranteed to be populated. Resolve
          # the PR from the exact commit that produced the successful check.
          prs="$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$REPOSITORY/commits/$RUN_SHA/pulls")"

          pr_number="$(jq -r --arg sha "$RUN_SHA" '
            .[]
            | select(
                .state == "open"
                and .draft != true
                and .base.ref == "main"
                and .head.sha == $sha
              )
            | .number
          ' <<<"$prs" | head -n1)"

          if [ -z "$pr_number" ]; then
            echo "No open, non-draft main-targeting PR is associated with validated commit $RUN_SHA."
            exit 0
          fi

          pr="$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$REPOSITORY/pulls/$pr_number")"

          state="$(jq -r '.state' <<<"$pr")"
          draft="$(jq -r '.draft' <<<"$pr")"
          head_sha="$(jq -r '.head.sha' <<<"$pr")"

          if [ "$state" != "open" ] || [ "$draft" = "true" ]; then
            echo "PR #$pr_number is no longer an open ready PR; nothing to merge."
            exit 0
          fi

          if [ "$head_sha" != "$RUN_SHA" ]; then
            echo "PR #$pr_number moved from validated $RUN_SHA to $head_sha; waiting for its newer check run."
            exit 0
          fi

          # Match the validated SHA again at the merge endpoint to prevent a
          # newer commit from being merged under an older successful result.
          gh pr merge "$pr_number" \
            --repo "$REPOSITORY" \
            --squash \
            --delete-branch \
            --match-head-commit "$RUN_SHA"
