name: Auto-merge passing PRs

on:
  workflow_run:
    workflows: ["Flutter checks"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Merge the exact validated pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          pr_number="$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")"
          if [ -z "$pr_number" ]; then
            echo "No pull request is associated with workflow run ${{ github.event.workflow_run.id }}; nothing to merge."
            exit 0
          fi

          pr="$(gh api "repos/$REPOSITORY/pulls/$pr_number")"
          state="$(jq -r '.state' <<<"$pr")"
          draft="$(jq -r '.draft' <<<"$pr")"
          head_sha="$(jq -r '.head.sha' <<<"$pr")"

          if [ "$state" != "open" ]; then
            echo "PR #$pr_number is $state; nothing to merge."
            exit 0
          fi

          if [ "$draft" = "true" ]; then
            echo "PR #$pr_number is still a draft; nothing to merge."
            exit 0
          fi

          if [ "$head_sha" != "$RUN_SHA" ]; then
            echo "PR #$pr_number has moved from validated $RUN_SHA to $head_sha; waiting for its newer run."
            exit 0
          fi

          gh pr merge "$pr_number" \
            --repo "$REPOSITORY" \
            --squash \
            --delete-branch
