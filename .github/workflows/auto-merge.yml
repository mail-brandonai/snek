name: Auto-merge passing PRs

on:
  workflow_run:
    workflows: ["Flutter checks"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted
    steps:
      - name: Merge the exact validated pull request
        env:
          API_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/$REPOSITORY"
          auth_headers=(
            -H "Accept: application/vnd.github+json"
            -H "Authorization: Bearer $API_TOKEN"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )

          # workflow_run.pull_requests is not guaranteed to be populated. Resolve
          # the PR from the exact commit that produced the successful check.
          prs="$(curl --fail --silent --show-error "${auth_headers[@]}" \
            "$api/commits/$RUN_SHA/pulls")"

          pr_number="$(jq -r --arg sha "$RUN_SHA" '
            [
              .[]
              | select(
                  .state == "open"
                  and .draft != true
                  and .base.ref == "main"
                  and .head.sha == $sha
                )
            ]
            | .[0].number // empty
          ' <<<"$prs")"

          if [ -z "$pr_number" ]; then
            echo "No open, non-draft main-targeting PR is associated with validated commit $RUN_SHA."
            exit 0
          fi

          pr="$(curl --fail --silent --show-error "${auth_headers[@]}" \
            "$api/pulls/$pr_number")"

          state="$(jq -r '.state' <<<"$pr")"
          draft="$(jq -r '.draft' <<<"$pr")"
          base_branch="$(jq -r '.base.ref' <<<"$pr")"
          head_sha="$(jq -r '.head.sha' <<<"$pr")"

          if [ "$state" != "open" ] || [ "$draft" = "true" ] || [ "$base_branch" != "main" ]; then
            echo "PR #$pr_number is no longer an open, ready PR targeting main; nothing to merge."
            exit 0
          fi

          if [ "$head_sha" != "$RUN_SHA" ]; then
            echo "PR #$pr_number moved from validated $RUN_SHA to $head_sha; waiting for its newer check run."
            exit 0
          fi

          # Supplying the validated SHA to the merge endpoint makes GitHub
          # reject the merge if the PR head changed after the check completed.
          merge_payload="$(jq -nc --arg sha "$RUN_SHA" '
            {sha: $sha, merge_method: "squash"}
          ')"
          merge_result="$(curl --fail --silent --show-error \
            "${auth_headers[@]}" \
            -H "Content-Type: application/json" \
            -X PUT \
            -d "$merge_payload" \
            "$api/pulls/$pr_number/merge")"
          jq -e '.merged == true' >/dev/null <<<"$merge_result"
          echo "Merged PR #$pr_number at $(jq -r '.sha' <<<"$merge_result")."

          # Delete the head branch when it belongs to this repository, matching
          # the previous --delete-branch behavior without touching fork branches.
          head_repo="$(jq -r '.head.repo.full_name // empty' <<<"$pr")"
          head_ref="$(jq -r '.head.ref // empty' <<<"$pr")"
          if [ "$head_repo" = "$REPOSITORY" ] && [ -n "$head_ref" ]; then
            encoded_ref="$(jq -nr --arg ref "heads/$head_ref" '
              $ref | split("/") | map(@uri) | join("/")
            ')"
            if ! curl --fail --silent --show-error "${auth_headers[@]}" \
              -X DELETE "$api/git/refs/$encoded_ref" >/dev/null; then
              echo "PR merged; branch $head_ref could not be deleted."
            fi
          fi
