name: Flutter checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: snek-flutter-checks
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, linux, x64, snek]
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Prepare CI logs
        run: mkdir -p ci-logs

      - name: Verify preinstalled Snek toolchain
        id: toolchain
        continue-on-error: true
        run: |
          set -euo pipefail
          flutter_version="$(flutter --version --machine | jq -r '.frameworkVersion')"
          echo "Flutter $flutter_version"
          test "$flutter_version" = "3.47.5"
          java -version
          "$CHROME_EXECUTABLE" --version
          chromedriver --version
          adb version
          emulator -version
          sdkmanager --version
          android_packages="$(sdkmanager --list_installed 2>&1)"
          for package in \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "system-images;android-35;google_apis;x86_64" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"; do
            grep -Fq "$package" <<< "$android_packages" || {
              echo "Missing preinstalled Android package: $package"
              exit 1
            }
          done

      - name: Prepare web platform
        id: web_platform
        continue-on-error: true
        run: |
          set -o pipefail
          flutter create --platforms=web . 2>&1 | tee ci-logs/web-platform.log

      - name: Prepare Drift web runtime assets
        id: drift_web_assets
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p web ci-logs
          curl --fail --location --silent --show-error \
            https://github.com/simolus3/drift/releases/download/drift-2.35.0/sqlite3.wasm \
            --output web/sqlite3.wasm
          curl --fail --location --silent --show-error \
            https://github.com/simolus3/drift/releases/download/drift-2.35.0/drift_worker.js \
            --output web/drift_worker.js
          printf '%s  %s\n' \
            13d3f11d05b39ba0618a7115fb41640a5d48b6300f5d3f325f554b42bd6688a4 \
            web/sqlite3.wasm \
            df0066e75363a9bed59a14eedbbded421c1f5910f8379812df164716aa2e6eed \
            web/drift_worker.js | sha256sum --check

      - name: Generate Drift database code
        id: drift_codegen
        continue-on-error: true
        run: |
          set -o pipefail
          dart run build_runner build --delete-conflicting-outputs 2>&1 | tee ci-logs/drift-codegen.log

      - name: Check formatting
        id: format
        continue-on-error: true
        run: |
          set -o pipefail
          dart format --output=none --set-exit-if-changed lib test integration_test test_driver 2>&1 | tee ci-logs/format.log

      - name: Analyze
        id: analyze
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee ci-logs/analyze.log

      - name: Unit tests
        id: test
        continue-on-error: true
        run: |
          set -o pipefail
          flutter test --coverage 2>&1 | tee ci-logs/test.log

      - name: Web persistence probe
        id: web_storage
        continue-on-error: true
        timeout-minutes: 10
        run: |
          set -euo pipefail
          chromedriver --port=4444 > ci-logs/chromedriver.log 2>&1 &
          chromedriver_pid=$!
          trap 'kill "$chromedriver_pid" 2>/dev/null || true; wait "$chromedriver_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4444/status >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4444/status >/dev/null
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/web_persistence_probe_test.dart \
            -d chrome 2>&1 | tee ci-logs/web-storage.log

      - name: Start Android emulator
        id: android_platform
        continue-on-error: true
        timeout-minutes: 15
        run: |
          set -euo pipefail
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          echo "no" | avdmanager create avd --force --name snek-ci \
            --package "system-images;android-35;google_apis;x86_64" \
            --device pixel_2
          emulator -avd snek-ci -no-window -no-audio -no-boot-anim \
            -no-snapshot -gpu swiftshader_indirect -accel off \
            > "$RUNNER_TEMP/snek-emulator.log" 2>&1 &
          adb start-server
          if ! timeout 180s adb wait-for-device; then
            cat "$RUNNER_TEMP/snek-emulator.log"
            echo "Android emulator did not become available to adb within 180 seconds."
            exit 1
          fi
          booted=false
          for attempt in $(seq 1 300); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)" = "1" ]; then
              booted=true
              break
            fi
            sleep 2
          done
          if [ "$booted" != true ]; then
            cat "$RUNNER_TEMP/snek-emulator.log"
            echo "Android emulator did not finish booting."
            exit 1
          fi
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb devices

      - name: Android persistence probe
        id: android_storage
        continue-on-error: true
        timeout-minutes: 15
        run: |
          set -o pipefail
          android_device="$(adb devices | awk 'NR > 1 && $2 == "device" { print $1; exit }')"
          if [ -z "$android_device" ]; then
            echo "No Android emulator is available." | tee ci-logs/android-storage.log
            exit 1
          fi
          flutter test integration_test/android_persistence_probe_test.dart \
            --device-id "$android_device" 2>&1 | tee ci-logs/android-storage.log

      - name: Stop Android emulator
        if: always()
        run: adb emu kill >/dev/null 2>&1 || true

      - name: Build Android debug APK
        id: build_android
        continue-on-error: true
        timeout-minutes: 20
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee ci-logs/build-android.log

      - name: Build web release
        id: build_web
        continue-on-error: true
        timeout-minutes: 15
        run: |
          set -o pipefail
          flutter build web --release 2>&1 | tee ci-logs/build-web.log

      - name: Summarize CI results
        if: always()
        run: |
          {
            echo "Flutter CI summary"
            echo "run_id=${{ github.run_id }}"
            echo "commit=${{ github.sha }}"
            echo "toolchain=${{ steps.toolchain.outcome }}"
            echo "web_platform=${{ steps.web_platform.outcome }}"
            echo "drift_web_assets=${{ steps.drift_web_assets.outcome }}"
            echo "drift_codegen=${{ steps.drift_codegen.outcome }}"
            echo "format=${{ steps.format.outcome }}"
            echo "analyze=${{ steps.analyze.outcome }}"
            echo "test=${{ steps.test.outcome }}"
            echo "web_storage=${{ steps.web_storage.outcome }}"
            echo "android_platform=${{ steps.android_platform.outcome }}"
            echo "android_storage=${{ steps.android_storage.outcome }}"
            echo "build_android=${{ steps.build_android.outcome }}"
            echo "build_web=${{ steps.build_web.outcome }}"
          } | tee ci-logs/summary.txt

          test "${{ steps.toolchain.outcome }}" = success
          test "${{ steps.web_platform.outcome }}" = success
          test "${{ steps.drift_web_assets.outcome }}" = success
          test "${{ steps.drift_codegen.outcome }}" = success
          test "${{ steps.format.outcome }}" = success
          test "${{ steps.analyze.outcome }}" = success
          test "${{ steps.test.outcome }}" = success
          test "${{ steps.web_storage.outcome }}" = success
          test "${{ steps.android_platform.outcome }}" = success
          test "${{ steps.android_storage.outcome }}" = success
          test "${{ steps.build_android.outcome }}" = success
          test "${{ steps.build_web.outcome }}" = success

      - name: Upload CI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-${{ github.run_id }}
          path: ci-logs/
          if-no-files-found: error
          retention-days: 14

      - name: Upload web build
        if: steps.build_web.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: slither-web-${{ github.run_id }}
          path: build/web/
          if-no-files-found: error
          retention-days: 14
