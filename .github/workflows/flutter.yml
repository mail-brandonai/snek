name: Flutter checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: flutter-checks-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: self-hosted
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare CI logs
        run: mkdir -p ci-logs

      - name: Prepare web platform
        id: web_platform
        continue-on-error: true
        run: |
          set -o pipefail
          flutter create --platforms=web . 2>&1 | tee ci-logs/web-platform.log

      - name: Prepare Drift web runtime assets
        id: drift_web_assets
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p web ci-logs
          curl --fail --location --silent --show-error \
            https://github.com/simolus3/drift/releases/download/drift-2.35.0/sqlite3.wasm \
            --output web/sqlite3.wasm
          curl --fail --location --silent --show-error \
            https://github.com/simolus3/drift/releases/download/drift-2.35.0/drift_worker.js \
            --output web/drift_worker.js
          printf '%s  %s\n' \
            13d3f11d05b39ba0618a7115fb41640a5d48b6300f5d3f325f554b42bd6688a4 \
            web/sqlite3.wasm \
            df0066e75363a9bed59a14eedbbded421c1f5910f8379812df164716aa2e6eed \
            web/drift_worker.js | sha256sum --check

      - name: Generate Drift database code
        id: drift_codegen
        continue-on-error: true
        run: |
          set -o pipefail
          dart run build_runner build --delete-conflicting-outputs 2>&1 | tee ci-logs/drift-codegen.log

      - name: Check formatting
        id: format
        continue-on-error: true
        run: |
          set -o pipefail
          dart format --output=none --set-exit-if-changed lib test integration_test 2>&1 | tee ci-logs/format.log

      - name: Analyze
        id: analyze
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee ci-logs/analyze.log

      - name: Unit tests
        id: test
        continue-on-error: true
        run: |
          set -o pipefail
          flutter test --coverage 2>&1 | tee ci-logs/test.log

      - name: Web persistence probe
        id: web_storage
        continue-on-error: true
        run: |
          set -o pipefail
          flutter test --platform chrome integration_test/web_persistence_probe_test.dart 2>&1 | tee ci-logs/web-storage.log

      - name: Android persistence probe
        id: android_storage
        continue-on-error: true
        run: |
          set -o pipefail
          android_device="$(adb devices | awk 'NR > 1 && $2 == "device" { print $1; exit }')"
          if [ -z "$android_device" ]; then
            echo "No Android device or emulator is attached to this self-hosted runner." | tee ci-logs/android-storage.log
            exit 1
          fi
          flutter test integration_test/android_persistence_probe_test.dart --device-id "$android_device" 2>&1 | tee ci-logs/android-storage.log

      - name: Build Android debug APK
        id: build_android
        continue-on-error: true
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee ci-logs/build-android.log

      - name: Build web release
        id: build_web
        continue-on-error: true
        run: |
          set -o pipefail
          flutter build web --release 2>&1 | tee ci-logs/build-web.log

      - name: Summarize CI results
        if: always()
        run: |
          {
            echo "Flutter CI summary"
            echo "run_id=${{ github.run_id }}"
            echo "commit=${{ github.sha }}"
            echo "format=${{ steps.format.outcome }}"
            echo "analyze=${{ steps.analyze.outcome }}"
            echo "test=${{ steps.test.outcome }}"
            echo "drift_codegen=${{ steps.drift_codegen.outcome }}"
            echo "web_platform=${{ steps.web_platform.outcome }}"
            echo "drift_web_assets=${{ steps.drift_web_assets.outcome }}"
            echo "web_storage=${{ steps.web_storage.outcome }}"
            echo "android_storage=${{ steps.android_storage.outcome }}"
            echo "build_android=${{ steps.build_android.outcome }}"
            echo "build_web=${{ steps.build_web.outcome }}"
          } | tee ci-logs/summary.txt

          test "${{ steps.format.outcome }}" = success
          test "${{ steps.analyze.outcome }}" = success
          test "${{ steps.test.outcome }}" = success
          test "${{ steps.drift_codegen.outcome }}" = success
          test "${{ steps.web_platform.outcome }}" = success
          test "${{ steps.drift_web_assets.outcome }}" = success
          test "${{ steps.web_storage.outcome }}" = success
          test "${{ steps.android_storage.outcome }}" = success
          test "${{ steps.build_android.outcome }}" = success
          test "${{ steps.build_web.outcome }}" = success

      - name: Upload CI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-${{ github.run_id }}
          path: ci-logs/
          if-no-files-found: error
          retention-days: 14

      - name: Upload web build
        if: steps.build_web.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: slither-web-${{ github.run_id }}
          path: build/web/
          if-no-files-found: error
          retention-days: 14
