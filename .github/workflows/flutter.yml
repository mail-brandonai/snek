name: Flutter checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare CI logs
        run: mkdir -p ci-logs

      - name: Check formatting
        id: format
        continue-on-error: true
        run: |
          set -o pipefail
          dart format lib test 2>&1 | tee ci-logs/format.log
          git diff -- lib test | tee ci-logs/format.patch

      - name: Analyze
        id: analyze
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee ci-logs/analyze.log

      - name: Unit tests
        id: test
        continue-on-error: true
        run: |
          set -o pipefail
          flutter test --coverage 2>&1 | tee ci-logs/test.log

      - name: Prepare web platform
        id: web_platform
        continue-on-error: true
        run: |
          set -o pipefail
          flutter create --platforms=web . 2>&1 | tee ci-logs/web-platform.log

      - name: Build web release
        id: build_web
        continue-on-error: true
        run: |
          set -o pipefail
          flutter build web --release 2>&1 | tee ci-logs/build-web.log

      - name: Summarize CI results
        if: always()
        run: |
          {
            echo "Flutter CI summary"
            echo "run_id=${{ github.run_id }}"
            echo "commit=${{ github.sha }}"
            echo "format=${{ steps.format.outcome }}"
            echo "analyze=${{ steps.analyze.outcome }}"
            echo "test=${{ steps.test.outcome }}"
            echo "web_platform=${{ steps.web_platform.outcome }}"
            echo "build_web=${{ steps.build_web.outcome }}"
          } | tee ci-logs/summary.txt

          test "${{ steps.format.outcome }}" = success
          test "${{ steps.analyze.outcome }}" = success
          test "${{ steps.test.outcome }}" = success
          test "${{ steps.web_platform.outcome }}" = success
          test "${{ steps.build_web.outcome }}" = success

      - name: Upload CI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-${{ github.run_id }}
          path: ci-logs/
          if-no-files-found: error
          retention-days: 14

      - name: Upload web build
        if: steps.build_web.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: slither-web-${{ github.run_id }}
          path: build/web/
          if-no-files-found: error
          retention-days: 14
