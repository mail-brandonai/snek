name: Flutter checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: flutter-checks-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: self-hosted
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare CI logs
        run: mkdir -p ci-logs

      - name: Prepare web platform
        id: web_platform
        continue-on-error: true
        run: |
          set -o pipefail
          flutter create --platforms=web . 2>&1 | tee ci-logs/web-platform.log

      - name: Prepare Drift web runtime assets
        id: drift_web_assets
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p web ci-logs
          curl --fail --location --silent --show-error \
            https://github.com/simolus3/drift/releases/download/drift-2.35.0/sqlite3.wasm \
            --output web/sqlite3.wasm
          curl --fail --location --silent --show-error \
            https://github.com/simolus3/drift/releases/download/drift-2.35.0/drift_worker.js \
            --output web/drift_worker.js
          printf '%s  %s\n' \
            13d3f11d05b39ba0618a7115fb41640a5d48b6300f5d3f325f554b42bd6688a4 \
            web/sqlite3.wasm \
            df0066e75363a9bed59a14eedbbded421c1f5910f8379812df164716aa2e6eed \
            web/drift_worker.js | sha256sum --check

      - name: Install Chrome for Web tests
        id: chrome_setup
        continue-on-error: true
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/chrome-for-testing.json"
          curl --fail --location --silent --show-error \
            https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json \
            --output "$metadata"
          chrome_version="$(jq -r '.channels.Stable.version' "$metadata")"
          chrome_url="$(jq -r '.channels.Stable.downloads.chrome[] | select(.platform == "linux64") | .url' "$metadata")"
          chrome_root="$RUNNER_TOOL_CACHE/chrome-for-testing"
          chrome_dir="$chrome_root/$chrome_version"
          chrome_binary="$chrome_dir/chrome-linux64/chrome"
          if [ ! -x "$chrome_binary" ]; then
            mkdir -p "$chrome_dir"
            curl --fail --location --silent --show-error "$chrome_url" \
              --output "$RUNNER_TEMP/chrome-for-testing.zip"
            unzip -q "$RUNNER_TEMP/chrome-for-testing.zip" -d "$chrome_dir"
          fi
          test -x "$chrome_binary"
          echo "CHROME_EXECUTABLE=$chrome_binary" >> "$GITHUB_ENV"
          "$chrome_binary" --version | tee ci-logs/chrome-version.log

      - name: Install Android SDK and start emulator
        id: android_platform
        continue-on-error: true
        run: |
          set -euo pipefail
          android_sdk="$RUNNER_TOOL_CACHE/android-sdk"
          mkdir -p "$android_sdk/cmdline-tools"
          repository_xml="$RUNNER_TEMP/android-repository.xml"
          curl --fail --location --silent --show-error \
            https://dl.google.com/android/repository/repository2-3.xml \
            --output "$repository_xml"
          command_line_url="$(python3 - "$repository_xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          package = next(
              item for item in root.iter("remotePackage")
              if item.get("path") == "cmdline-tools;latest"
          )
          for archive in package.findall("./archives/archive"):
              if archive.findtext("./host-os") == "linux":
                  print(archive.findtext("./complete/url"))
                  break
          else:
              raise SystemExit("Linux Android command-line tools archive not found")
          PY
          )"
          if [ ! -x "$android_sdk/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$RUNNER_TEMP/android-command-line-tools"
            curl --fail --location --silent --show-error \
              "https://dl.google.com/android/repository/$command_line_url" \
              --output "$RUNNER_TEMP/android-command-line-tools.zip"
            unzip -q "$RUNNER_TEMP/android-command-line-tools.zip" \
              -d "$RUNNER_TEMP/android-command-line-tools"
            mkdir -p "$android_sdk/cmdline-tools/latest"
            cp -a "$RUNNER_TEMP/android-command-line-tools/cmdline-tools/." \
              "$android_sdk/cmdline-tools/latest/"
          fi
          export ANDROID_HOME="$android_sdk"
          export ANDROID_SDK_ROOT="$android_sdk"
          export PATH="$android_sdk/cmdline-tools/latest/bin:$android_sdk/platform-tools:$android_sdk/emulator:$PATH"
          set +e
          yes | sdkmanager --sdk_root="$android_sdk" --licenses >/dev/null 2>&1
          license_status="${PIPESTATUS[1]}"
          set -e
          if [ "$license_status" -ne 0 ]; then
            echo "Android SDK license acceptance failed."
            exit "$license_status"
          fi
          set +e
          yes | sdkmanager --sdk_root="$android_sdk" \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0" \
            "emulator" "system-images;android-35;google_apis;x86_64" \
            2>&1 | tee ci-logs/android-sdk-install.log
          sdk_status="${PIPESTATUS[1]}"
          set -e
          if [ "$sdk_status" -ne 0 ]; then
            exit "$sdk_status"
          fi
          echo "ANDROID_HOME=$android_sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$android_sdk" >> "$GITHUB_ENV"
          echo "$android_sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$android_sdk/platform-tools" >> "$GITHUB_PATH"
          echo "$android_sdk/emulator" >> "$GITHUB_PATH"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          echo "no" | avdmanager create avd --force --name snek-ci \
            --package "system-images;android-35;google_apis;x86_64" \
            --device pixel_2
          acceleration="off"
          if [ -c /dev/kvm ] && [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            acceleration="on"
          fi
          emulator -avd snek-ci -no-window -no-audio -no-boot-anim \
            -no-snapshot -gpu swiftshader_indirect -accel "$acceleration" \
            > "$RUNNER_TEMP/snek-emulator.log" 2>&1 &
          adb start-server
          adb wait-for-device
          booted=false
          for attempt in $(seq 1 300); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\\r' || true)" = "1" ]; then
              booted=true
              break
            fi
            sleep 2
          done
          if [ "$booted" != true ]; then
            cat "$RUNNER_TEMP/snek-emulator.log"
            echo "Android emulator did not finish booting."
            exit 1
          fi
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb devices

      - name: Generate Drift database code
        id: drift_codegen
        continue-on-error: true
        run: |
          set -o pipefail
          dart run build_runner build --delete-conflicting-outputs 2>&1 | tee ci-logs/drift-codegen.log

      - name: Check formatting
        id: format
        continue-on-error: true
        run: |
          set -o pipefail
          dart format --output=none --set-exit-if-changed lib test integration_test 2>&1 | tee ci-logs/format.log

      - name: Analyze
        id: analyze
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee ci-logs/analyze.log

      - name: Unit tests
        id: test
        continue-on-error: true
        run: |
          set -o pipefail
          flutter test --coverage 2>&1 | tee ci-logs/test.log

      - name: Web persistence probe
        id: web_storage
        continue-on-error: true
        run: |
          set -o pipefail
          flutter test --platform chrome integration_test/web_persistence_probe_test.dart 2>&1 | tee ci-logs/web-storage.log

      - name: Android persistence probe
        id: android_storage
        continue-on-error: true
        run: |
          set -o pipefail
          android_device="$(adb devices | awk 'NR > 1 && $2 == "device" { print $1; exit }')"
          if [ -z "$android_device" ]; then
            echo "No Android device or emulator is attached to this self-hosted runner." | tee ci-logs/android-storage.log
            exit 1
          fi
          flutter test integration_test/android_persistence_probe_test.dart --device-id "$android_device" 2>&1 | tee ci-logs/android-storage.log

      - name: Build Android debug APK
        id: build_android
        continue-on-error: true
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee ci-logs/build-android.log

      - name: Build web release
        id: build_web
        continue-on-error: true
        run: |
          set -o pipefail
          flutter build web --release 2>&1 | tee ci-logs/build-web.log

      - name: Summarize CI results
        if: always()
        run: |
          {
            echo "Flutter CI summary"
            echo "run_id=${{ github.run_id }}"
            echo "commit=${{ github.sha }}"
            echo "format=${{ steps.format.outcome }}"
            echo "analyze=${{ steps.analyze.outcome }}"
            echo "test=${{ steps.test.outcome }}"
            echo "drift_codegen=${{ steps.drift_codegen.outcome }}"
            echo "web_platform=${{ steps.web_platform.outcome }}"
            echo "drift_web_assets=${{ steps.drift_web_assets.outcome }}"
            echo "chrome_setup=${{ steps.chrome_setup.outcome }}"
            echo "android_platform=${{ steps.android_platform.outcome }}"
            echo "web_storage=${{ steps.web_storage.outcome }}"
            echo "android_storage=${{ steps.android_storage.outcome }}"
            echo "build_android=${{ steps.build_android.outcome }}"
            echo "build_web=${{ steps.build_web.outcome }}"
          } | tee ci-logs/summary.txt

          test "${{ steps.format.outcome }}" = success
          test "${{ steps.analyze.outcome }}" = success
          test "${{ steps.test.outcome }}" = success
          test "${{ steps.drift_codegen.outcome }}" = success
          test "${{ steps.web_platform.outcome }}" = success
          test "${{ steps.drift_web_assets.outcome }}" = success
          test "${{ steps.chrome_setup.outcome }}" = success
          test "${{ steps.android_platform.outcome }}" = success
          test "${{ steps.web_storage.outcome }}" = success
          test "${{ steps.android_storage.outcome }}" = success
          test "${{ steps.build_android.outcome }}" = success
          test "${{ steps.build_web.outcome }}" = success

      - name: Upload CI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-${{ github.run_id }}
          path: ci-logs/
          if-no-files-found: error
          retention-days: 14

      - name: Upload web build
        if: steps.build_web.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: slither-web-${{ github.run_id }}
          path: build/web/
          if-no-files-found: error
          retention-days: 14
